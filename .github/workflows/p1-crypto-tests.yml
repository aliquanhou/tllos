name: P1-01 Secure Random Tests

on:
  push:
    paths:
      - 'host/c/crypto_builtin.c'
      - 'host/c/sqlite_builtin.c'
      - 'host/c/sqlite3.c'
      - 'host/c/tllvm.h'
      - 'host/c/builtin.c'
      - 'host/c/main.c'
      - 'host/c/vm.c'
      - 'host/c/value.c'
      - 'host/c/json.c'
      - 'host/c/Makefile'
      - 'compiler/codegen.tll'
      - 'compiler/linker.tll'
      - 'tests/crypto/**'
      - '.github/workflows/p1-crypto-tests.yml'
  pull_request:
    paths:
      - 'host/c/crypto_builtin.c'
      - 'tests/crypto/**'

jobs:
  test-linux:
    name: Linux (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libssl-dev

      - name: Check environment
        run: |
          gcc --version
          free -h
          df -h
          echo "=== Files in host/c ==="
          ls -la host/c/*.c
          echo "=== sqlite3.c size ==="
          wc -c host/c/sqlite3.c
          echo "=== sqlite3.c first 3 lines ==="
          head -3 host/c/sqlite3.c

      - name: Test simple compile
        run: |
          echo '#include <stdio.h>
          int main() { printf("hello\\n"); return 0; }' > /tmp/test.c
          gcc /tmp/test.c -o /tmp/test
          /tmp/test
          echo "Simple compile OK"

      - name: Build tllvm (per-file)
        run: |
          cd host/c
          echo "=== Compiling each file separately ===" > build_log.txt
          for f in main.c vm.c value.c json.c builtin.c sqlite_builtin.c crypto_builtin.c password_builtin.c hmac_builtin.c http_client_builtin.c; do
            echo "--- Compiling $f ---" >> build_log.txt
            gcc -O0 -w -std=c99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -c $f -o ${f%.c}.o >> build_log.txt 2>&1
            echo "  Exit: $?" >> build_log.txt
          done
          echo "--- Compiling sqlite3.c ---" >> build_log.txt
          gcc -O0 -w -std=c99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -DSQLITE_THREADSAFE=1 -c sqlite3.c -o sqlite3.o >> build_log.txt 2>&1
          echo "  sqlite3.c Exit: $?" >> build_log.txt
          echo "=== Linking ===" >> build_log.txt
          gcc -O0 -o tllvm main.o vm.o value.o json.o builtin.o sqlite_builtin.o crypto_builtin.o password_builtin.o hmac_builtin.o http_client_builtin.o sqlite3.o -lm -lpthread -ldl -lssl -lcrypto >> build_log.txt 2>&1
          LINK_EXIT=$?
          echo "=== Link exit code: $LINK_EXIT ===" >> build_log.txt
          cat build_log.txt
          if [ $LINK_EXIT -ne 0 ]; then
            echo "::error::Link failed with exit code $LINK_EXIT"
            exit 1
          fi
          ls -la tllvm

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: host/c/build_log.txt
          retention-days: 7

      - name: Build TLL compiler
        run: |
          ./host/c/tllvm tools/TLLC/tllc.tllbc compile tools/TLLC/main.tll -o tools/TLLC/tllc_new.tllbc
          ls -la tools/TLLC/tllc_new.tllbc

      - name: Run Secure Random Gate tests
        run: |
          ./host/c/tllvm tools/TLLC/tllc_new.tllbc compile tests/crypto/gate_secure_random.tll -o tests/crypto/gate_secure_random.tllbc
          ./host/c/tllvm tests/crypto/gate_secure_random.tllbc

      - name: Run multi-thread tests
        run: |
          ./host/c/tllvm tools/TLLC/tllc_new.tllbc compile tests/crypto/test_multithread.tll -o tests/crypto/test_multithread.tllbc
          ./host/c/tllvm tests/crypto/test_multithread.tllbc

  test-windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build tllvm.exe (per-file)
        shell: cmd
        run: |
          cd host\c
          echo === Compiling each file separately === > build_log.txt
          for %%f in (main.c vm.c value.c json.c builtin.c sqlite_builtin.c crypto_builtin.c password_builtin.c hmac_builtin.c http_client_builtin.c) do (
            echo --- Compiling %%f --- >> build_log.txt
            cl /c /O0 /w /D_CRT_SECURE_NO_WARNINGS /D_WIN32 %%f >> build_log.txt 2>&1
            echo   Exit: %errorlevel% >> build_log.txt
          )
          echo --- Compiling sqlite3.c --- >> build_log.txt
          cl /c /O0 /w /D_CRT_SECURE_NO_WARNINGS /D_WIN32 /DSQLITE_THREADSAFE=1 sqlite3.c >> build_log.txt 2>&1
          echo   sqlite3.c Exit: %errorlevel% >> build_log.txt
          echo === Linking === >> build_log.txt
          link /OUT:tllvm.exe main.obj vm.obj value.obj json.obj builtin.obj sqlite_builtin.obj crypto_builtin.obj password_builtin.obj hmac_builtin.obj http_client_builtin.obj sqlite3.obj bcrypt.lib advapi32.lib ws2_32.lib winhttp.lib >> build_log.txt 2>&1
          echo === Link exit code: %errorlevel% === >> build_log.txt
          type build_log.txt
          if errorlevel 1 exit /b 1
          dir tllvm.exe

      - name: Upload build log (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: host/c/build_log.txt
          retention-days: 7

      - name: Build TLL compiler
        shell: cmd
        run: |
          .\host\c\tllvm.exe tools\TLLC\tllc.tllbc compile tools\TLLC\main.tll -o tools\TLLC\tllc_new.tllbc
          if errorlevel 1 exit /b 1

      - name: Run Secure Random Gate tests
        shell: cmd
        run: |
          .\host\c\tllvm.exe tools\TLLC\tllc_new.tllbc compile tests\crypto\gate_secure_random.tll -o tests\crypto\gate.tllbc
          if errorlevel 1 exit /b 1
          .\host\c\tllvm.exe tests\crypto\gate.tllbc
          if errorlevel 1 exit /b 1

      - name: Run multi-thread tests
        shell: cmd
        run: |
          .\host\c\tllvm.exe tools\TLLC\tllc_new.tllbc compile tests\crypto\test_multithread.tll -o tests\crypto\mt.tllbc
          if errorlevel 1 exit /b 1
          .\host\c\tllvm.exe tests\crypto\mt.tllbc
          if errorlevel 1 exit /b 1

  test-macos:
    name: macOS (Apple Silicon / Intel)
    runs-on: macos-latest
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Build tllvm (per-file)
        run: |
          cd host/c
          echo "=== Compiling each file separately ===" > build_log.txt
          for f in main.c vm.c value.c json.c builtin.c sqlite_builtin.c crypto_builtin.c password_builtin.c hmac_builtin.c http_client_builtin.c; do
            echo "--- Compiling $f ---" >> build_log.txt
            clang -O0 -w -std=gnu99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -D_DARWIN_C_SOURCE -c $f -o ${f%.c}.o >> build_log.txt 2>&1
            echo "  Exit: $?" >> build_log.txt
          done
          echo "--- Compiling sqlite3.c ---" >> build_log.txt
          clang -O0 -w -std=gnu99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -D_DARWIN_C_SOURCE -DSQLITE_THREADSAFE=1 -c sqlite3.c -o sqlite3.o >> build_log.txt 2>&1
          echo "  sqlite3.c Exit: $?" >> build_log.txt
          echo "=== Linking ===" >> build_log.txt
          clang -O0 -o tllvm main.o vm.o value.o json.o builtin.o sqlite_builtin.o crypto_builtin.o password_builtin.o hmac_builtin.o http_client_builtin.o sqlite3.o -lm -lpthread -lssl -lcrypto >> build_log.txt 2>&1
          LINK_EXIT=$?
          echo "=== Link exit code: $LINK_EXIT ===" >> build_log.txt
          cat build_log.txt
          if [ $LINK_EXIT -ne 0 ]; then
            echo "::error::Link failed with exit code $LINK_EXIT"
            exit 1
          fi
          ls -la tllvm

      - name: Upload build log (macOS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: host/c/build_log.txt
          retention-days: 7

      - name: Build TLL compiler
        run: |
          ./host/c/tllvm tools/TLLC/tllc.tllbc compile tools/TLLC/main.tll -o tools/TLLC/tllc_new.tllbc
          ls -la tools/TLLC/tllc_new.tllbc

      - name: Run Secure Random Gate tests
        run: |
          ./host/c/tllvm tools/TLLC/tllc_new.tllbc compile tests/crypto/gate_secure_random.tll -o tests/crypto/gate_secure_random.tllbc
          ./host/c/tllvm tests/crypto/gate_secure_random.tllbc

      - name: Run multi-thread tests
        run: |
          ./host/c/tllvm tools/TLLC/tllc_new.tllbc compile tests/crypto/test_multithread.tll -o tests/crypto/test_multithread.tllbc
          ./host/c/tllvm tests/crypto/test_multithread.tllbc
