name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build Native Launcher
        run: |
          cd host/c
          gcc -O2 -std=c99 -D_WIN32=0 -o tllvm main.c vm.c value.c json.c builtin.c

      - name: Verify bootstrap seed
        run: |
          test -f compiler/compiler.tllbc
          test -f runtime/vm_run.tllbc

      - name: Native self-host
        run: |
          cd host/c
          ./tllvm ../../compiler/compiler.tllbc
          test -f ../../compiler/compiler_self_compiled.tllbc

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            host/c/tllvm
            compiler/compiler.tllbc
            runtime/vm_run.tllbc
