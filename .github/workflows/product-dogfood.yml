name: Product Dogfood

on:
  push:
    branches: [feature/*]
  workflow_dispatch:

jobs:
  product-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev

      - name: Build Native Launcher
        run: |
          cd host/c
          gcc -O2 -std=gnu99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -o tllvm main.c vm.c value.c json.c builtin.c sqlite_builtin.c crypto_builtin.c password_builtin.c hmac_builtin.c http_client_builtin.c sqlite3.c -lm -lpthread -ldl -lssl -lcrypto

      - name: Bootstrap tllc
        run: |
          chmod +x scripts/*.sh
          scripts/bootstrap-tllc.sh
          test -f tools/TLLC/tllc.tllbc

      - name: Product Slice - Compile
        run: |
          echo "=== Compiling Product Slice ==="
          mkdir -p mall/data
          host/c/tllvm tools/TLLC/tllc.tllbc compile mall/product_slice_test.tll -o /tmp/product_slice.tllbc
          echo "Compile exit: $?"
          ls -la /tmp/product_slice.tllbc

      - name: Product Slice - Run & Test
        run: |
          echo "=== Starting Product Slice server ==="
          mkdir -p mall/data
          rm -f mall/data/mall.db
          ls -la mall/
          ls -la mall/data/ 2>/dev/null || echo "mall/data does not exist"
          host/c/tllvm /tmp/product_slice.tllbc > /tmp/product_slice.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 5

          echo "=== Server log (first 50 lines) ==="
          head -50 /tmp/product_slice.log

          echo "=== G1: Server starts ==="
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "PASS: Server is running"
          else
            echo "FAIL: Server failed to start"
            echo "=== Full server log ==="
            cat /tmp/product_slice.log
            exit 1
          fi

          echo "=== G2: GET /health ==="
          HEALTH_RESPONSE=$(curl -s http://127.0.0.1:8088/health 2>&1)
          echo "Response: [$HEALTH_RESPONSE]"
          if echo "$HEALTH_RESPONSE" | grep -q 'ok'; then
            echo "PASS: Health check OK"
          else
            echo "FAIL: Health check failed"
            echo "=== Server log ==="
            cat /tmp/product_slice.log
            exit 1
          fi

          echo "=== G3: GET /products returns 200 ==="
          PRODUCTS_RESPONSE=$(curl -s -w "\n%{http_code}" http://127.0.0.1:8088/products 2>&1)
          HTTP_CODE=$(echo "$PRODUCTS_RESPONSE" | tail -1)
          PRODUCTS_BODY=$(echo "$PRODUCTS_RESPONSE" | sed '$d')
          echo "HTTP Code: [$HTTP_CODE]"
          echo "Body: [$PRODUCTS_BODY]"
          if test "$HTTP_CODE" = "200"; then
            echo "PASS: HTTP 200"
          else
            echo "FAIL: Expected 200, got $HTTP_CODE"
            exit 1
          fi

          echo "=== G4: JSON contains products ==="
          if echo "$PRODUCTS_BODY" | grep -q 'Widget'; then
            echo "PASS: Found Widget"
          else
            echo "FAIL: Widget not found"
            exit 1
          fi

          echo "=== G5: POST /products/seed ==="
          SEED_RESPONSE=$(curl -s -X POST http://127.0.0.1:8088/products/seed 2>&1)
          echo "Response: [$SEED_RESPONSE]"
          if echo "$SEED_RESPONSE" | grep -q 'ok'; then
            echo "PASS: Seed OK"
          else
            echo "FAIL: Seed failed"
            exit 1
          fi

          echo "=== G6: 404 for unknown route ==="
          NOTFOUND_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8088/nonexistent 2>&1)
          echo "HTTP Code: [$NOTFOUND_CODE]"
          if test "$NOTFOUND_CODE" = "404"; then
            echo "PASS: 404 OK"
          else
            echo "FAIL: Expected 404, got $NOTFOUND_CODE"
            exit 1
          fi

          echo "=== Server log after tests ==="
          cat /tmp/product_slice.log

          echo "=== Killing server ==="
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          echo "=== ALL GATES PASSED ==="
          echo "Product Vertical Slice: READY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-slice-logs
          path: |
            /tmp/product_slice.log
          if-no-files-found: warn
