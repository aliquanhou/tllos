name: Product Dogfood

on:
  push:
    branches: [feature/*]
  workflow_dispatch:

jobs:
  product-slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup C compiler
        run: sudo apt-get update && sudo apt-get install -y gcc libssl-dev

      - name: Build Native Launcher
        run: |
          cd host/c
          gcc -O2 -std=gnu99 -D_POSIX_C_SOURCE=200809L -D_GNU_SOURCE -o tllvm main.c vm.c value.c json.c builtin.c sqlite_builtin.c crypto_builtin.c password_builtin.c hmac_builtin.c http_client_builtin.c sqlite3.c -lm -lpthread -ldl -lssl -lcrypto

      - name: Bootstrap tllc
        run: |
          chmod +x scripts/*.sh
          scripts/bootstrap-tllc.sh
          test -f tools/TLLC/tllc.tllbc

      - name: Compile product_debug6.tll
        run: |
          echo "=== Compiling product_debug6.tll ==="
          mkdir -p mall/data
          host/c/tllvm tools/TLLC/tllc.tllbc compile mall/product_debug6.tll -o /tmp/product_debug6.tllbc
          echo "Compile exit: $?"
          ls -la /tmp/product_debug6.tllbc

      - name: Run product_debug6.tll and test HTTP
        run: |
          echo "=== Starting product_debug6 server ==="
          mkdir -p mall/data
          rm -f mall/data/mall.db
          host/c/tllvm /tmp/product_debug6.tllbc > /tmp/product_debug6.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          sleep 3

          echo "=== Server log ==="
          cat /tmp/product_debug6.log

          echo "=== Check if server is running ==="
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Server is running"
          else
            echo "Server FAILED to start"
            cat /tmp/product_debug6.log
            exit 1
          fi

          echo "=== Test GET /health ==="
          curl -s http://127.0.0.1:8088/health
          echo ""

          echo "=== Test GET /products (JSON) ==="
          curl -s http://127.0.0.1:8088/products
          echo ""

          echo "=== Server log after requests ==="
          cat /tmp/product_debug6.log

          echo "=== Killing server ==="
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "=== DONE ==="

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-debug-logs
          path: |
            /tmp/product_debug6.log
          if-no-files-found: warn
