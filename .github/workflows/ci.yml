name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup C compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Build Native Launcher (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd host/c
          gcc -O2 -std=c99 -D_WIN32=0 -o tllvm main.c vm.c value.c json.c builtin.c -lm
          ./tllvm --version 2>/dev/null || true

      - name: Build Native Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd host\c
          cl /O2 /D_CRT_SECURE_NO_WARNINGS /Fe:tllvm.exe main.c vm.c value.c json.c builtin.c
          if errorlevel 1 exit /b 1

      - name: Verify bootstrap seed exists
        run: |
          test -f compiler/compiler.tllbc
          test -f runtime/vm_run.tllbc

      - name: ABI consistency check (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/check-abi.sh
          scripts/check-abi.sh

      - name: ABI consistency check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\check-abi.bat

      - name: Native self-host verification (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd compiler
          ../host/c/tllvm compiler.tllbc
          test -f compiler_self_compiled.tllbc
          # Verify output is a real compiler (not empty stub)
          SIZE=$(wc -c < compiler_self_compiled.tllbc)
          test "$SIZE" -gt 100000
          rm -f compiler_self_compiled.tllbc

      - name: Native self-host verification (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd compiler
          ..\host\c\tllvm.exe compiler.tllbc
          if not exist compiler_self_compiled.tllbc exit /b 1
          for %%A in (compiler_self_compiled.tllbc) do if %%~zA LSS 100000 exit /b 1
          del compiler_self_compiled.tllbc

      - name: Bootstrap tllc (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/*.sh
          scripts/bootstrap-tllc.sh
          test -f tools/TLLC/tllc.tllbc

      - name: Bootstrap tllc (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          scripts\bootstrap-tllc.bat
          if not exist tools\TLLC\tllc.tllbc exit /b 1

      - name: Compile all tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/compile-tests.sh

      - name: Compile all tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\compile-tests.bat

      - name: Run all tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/run-tests.sh

      - name: Run all tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\run-tests.bat

      - name: End-to-end tllc verification (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          host/c/tllvm tools/TLLC/tllc.tllbc compile hello.tll -o /tmp/hello.tllbc
          host/c/tllvm /tmp/hello.tllbc | grep -q "Hello"

      - name: End-to-end tllc verification (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          host\c\tllvm.exe tools\TLLC\tllc.tllbc compile hello.tll -o hello_e2e.tllbc
          if errorlevel 1 exit /b 1
          host\c\tllvm.exe hello_e2e.tllbc
          if errorlevel 1 exit /b 1
