name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native-build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup C compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Setup C compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Build Native Launcher (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd host/c
          gcc -O2 -std=c99 -D_POSIX_C_SOURCE=200809L -o tllvm main.c vm.c value.c json.c builtin.c -lm
          ./tllvm --version 2>/dev/null || true

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Native Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd host\c
          cl /O2 /D_CRT_SECURE_NO_WARNINGS /Fe:tllvm.exe main.c vm.c value.c json.c builtin.c ws2_32.lib winhttp.lib
          if errorlevel 1 exit /b 1

      - name: Verify bootstrap seed exists
        run: |
          test -f compiler/compiler.tllbc
          test -f runtime/vm_run.tllbc

      - name: ABI consistency check (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/check-abi.sh
          scripts/check-abi.sh

      - name: ABI consistency check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\check-abi.bat

      - name: Native self-host verification (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd compiler
          ../host/c/tllvm compiler.tllbc
          test -f compiler_self_compiled.tllbc
          # Verify output is a real compiler (not empty stub)
          SIZE=$(wc -c < compiler_self_compiled.tllbc)
          test "$SIZE" -gt 100000
          rm -f compiler_self_compiled.tllbc

      - name: Native self-host verification (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd compiler
          ..\host\c\tllvm.exe compiler.tllbc
          if not exist compiler_self_compiled.tllbc exit /b 1
          for %%A in (compiler_self_compiled.tllbc) do if %%~zA LSS 100000 exit /b 1
          del compiler_self_compiled.tllbc

      - name: Bootstrap tllc (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/*.sh
          scripts/bootstrap-tllc.sh
          test -f tools/TLLC/tllc.tllbc

      - name: Bootstrap tllc (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          scripts\bootstrap-tllc.bat
          if not exist tools\TLLC\tllc.tllbc exit /b 1

      - name: Compile all tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/compile-tests.sh

      - name: Compile all tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\compile-tests.bat

      - name: Run all tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/run-tests.sh

      - name: Run all tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\run-tests.bat

      - name: End-to-end tllc verification (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          host/c/tllvm tools/TLLC/tllc.tllbc compile hello.tll -o /tmp/hello.tllbc
          host/c/tllvm /tmp/hello.tllbc | grep -q "Hello"

      - name: End-to-end tllc verification (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          host\c\tllvm.exe tools\TLLC\tllc.tllbc compile hello.tll -o hello_e2e.tllbc
          if errorlevel 1 exit /b 1
          host\c\tllvm.exe hello_e2e.tllbc
          if errorlevel 1 exit /b 1

      - name: Blockchain unit test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          host/c/tllvm tools/TLLC/tllc.tllbc compile tests/blockchain_basic.tll -o tests/blockchain_basic.tllbc
          host/c/tllvm tests/blockchain_basic.tllbc | grep -q "ALL TESTS PASSED"

      - name: Blockchain unit test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          host\c\tllvm.exe tools\TLLC\tllc.tllbc compile tests\blockchain_basic.tll -o tests\blockchain_basic.tllbc
          if errorlevel 1 exit /b 1
          host\c\tllvm.exe tests\blockchain_basic.tllbc
          if errorlevel 1 exit /b 1

      - name: P2P 2-Node test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          host/c/tllvm tools/TLLC/tllc.tllbc compile tests/p2p_2node_server.tll -o tests/p2p_2node_server.tllbc
          host/c/tllvm tools/TLLC/tllc.tllbc compile tests/p2p_2node_client.tll -o tests/p2p_2node_client.tllbc
          host/c/tllvm tests/p2p_2node_server.tllbc > /tmp/p2p_server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          host/c/tllvm tests/p2p_2node_client.tllbc > /tmp/p2p_client.log 2>&1
          CLIENT_EXIT=$?
          sleep 3
          kill $SERVER_PID 2>/dev/null || true
          cat /tmp/p2p_client.log
          grep -q "Received PONG" /tmp/p2p_client.log

      - name: P2P 4-Node test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for node in leader node2 node3 node4; do
            host/c/tllvm tools/TLLC/tllc.tllbc compile tests/p2p_4node_${node}.tll -o tests/p2p_4node_${node}.tllbc
          done
          host/c/tllvm tests/p2p_4node_leader.tllbc > /tmp/p2p_leader.log 2>&1 &
          sleep 1
          host/c/tllvm tests/p2p_4node_node2.tllbc > /tmp/p2p_node2.log 2>&1 &
          sleep 0.5
          host/c/tllvm tests/p2p_4node_node3.tllbc > /tmp/p2p_node3.log 2>&1 &
          sleep 0.5
          host/c/tllvm tests/p2p_4node_node4.tllbc > /tmp/p2p_node4.log 2>&1 &
          sleep 15
          pkill -f "p2p_4node" 2>/dev/null || true
          cat /tmp/p2p_leader.log
          grep -q "All 3 peers connected" /tmp/p2p_leader.log
          grep -q "Received ACK from node2" /tmp/p2p_leader.log
          grep -q "Received ACK from node3" /tmp/p2p_leader.log
          grep -q "Received ACK from node4" /tmp/p2p_leader.log

      # === P0-15.17.3: Blockchain Network CI Gate Closure ===
      # These tests use REAL independent processes + REAL TCP, no mocks.
      # Each test has hard assertions: any failure -> exit 1 -> CI RED.

      - name: Blockchain 4-Node network test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x scripts/run-bc-network-test.sh
          scripts/run-bc-network-test.sh bc_node

      - name: Blockchain 4-Node network test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\run-bc-network-test.ps1 bc_node

      - name: Blockchain 5-Block multi-node sync (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/run-bc-network-test.sh bc_multi

      - name: Blockchain 5-Block multi-node sync (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\run-bc-network-test.ps1 bc_multi

      - name: Blockchain auto-sync on connect (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/run-bc-network-test.sh bc_sync

      - name: Blockchain auto-sync on connect (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\run-bc-network-test.ps1 bc_sync

      - name: Blockchain reconnect + auto-sync (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/run-bc-network-test.sh bc_reconnect

      - name: Blockchain reconnect + auto-sync (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\run-bc-network-test.ps1 bc_reconnect

      - name: Blockchain invalid block + fork detection (Linux/macOS)
        if: runner.os != 'Windows'
        run: scripts/run-bc-network-test.sh bc_invalid

      - name: Blockchain invalid block + fork detection (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts\run-bc-network-test.ps1 bc_invalid

      # === P0-15.18.1: Coroutine 100K Stress Test (black-box, zero Runtime changes) ===
      # Verifies 100K immediate-return + 10K x10 yield + 1K sleep coroutines.
      # External evidence: exit code + process lifecycle + runtime + peak RSS.
      # No Runtime code modifications — if this fails, Runtime has a real bug.

      - name: Coroutine 100K Stress Test (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          set -x
          host/c/tllvm tools/TLLC/tllc.tllbc compile tests/coroutine_stress_test.tll -o tests/coroutine_stress_test.tllbc
          echo "Compile exit: $?"
          ls -la tests/coroutine_stress_test.tllbc
          echo "=== Running 100K Coroutine Stress Test ==="
          host/c/tllvm tests/coroutine_stress_test.tllbc 2>&1 | tee /tmp/coroutine_stress.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Exit code: $EXIT_CODE ==="
          echo "=== VM output log ==="
          cat /tmp/coroutine_stress.log
          # Hard assertions
          test "$EXIT_CODE" -eq 0
          grep -q "Test 1 PASS" /tmp/coroutine_stress.log
          grep -q "Test 2 PASS" /tmp/coroutine_stress.log
          grep -q "Test 3 PASS" /tmp/coroutine_stress.log
          ! grep -q "FAIL" /tmp/coroutine_stress.log
          grep -q "Stress Tests Done" /tmp/coroutine_stress.log
          ! pgrep -f "coroutine_stress_test" 2>/dev/null
          echo "=== Coroutine 100K Stress Test PASSED ==="

      - name: Coroutine 100K Stress Test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        run: |
          host\c\tllvm.exe tools\TLLC\tllc.tllbc compile tests\coroutine_stress_test.tll -o tests\coroutine_stress_test.tllbc
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          Write-Output "=== Running 100K Coroutine Stress Test ==="
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & host\c\tllvm.exe tests\coroutine_stress_test.tllbc 2>&1 | Tee-Object -FilePath coroutine_stress.log
          $EXIT_CODE = $LASTEXITCODE
          $sw.Stop()
          Write-Output "=== Exit code: $EXIT_CODE ==="
          Write-Output "=== Elapsed: $($sw.ElapsedMilliseconds)ms ==="
          # Hard assertions
          if ($EXIT_CODE -ne 0) { throw "Process exited with code $EXIT_CODE" }
          $log = Get-Content coroutine_stress.log -Raw
          if ($log -notmatch "Test 1 PASS") { throw "Test 1 did not PASS" }
          if ($log -notmatch "Test 2 PASS") { throw "Test 2 did not PASS" }
          if ($log -notmatch "Test 3 PASS") { throw "Test 3 did not PASS" }
          if ($log -match "FAIL") { throw "Test output contains FAIL" }
          if ($log -notmatch "Stress Tests Done") { throw "Test did not complete" }
          # Verify no orphan process
          $orphan = Get-Process -Name "tllvm" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like "*coroutine_stress*" }
          if ($orphan) { throw "Orphan process still exists: $($orphan.Id)" }
          Write-Output "=== Coroutine 100K Stress Test PASSED ==="

      # === P0-15.18.2R: TCP/FD Boundary Test with REAL sockets ===
      # Creates 70 real TCP connections (unique fds), probes tcp.select() with 60/64/65/70 real fds.
      # Windows TCC FD_SET had no bounds check: >64 fds caused stack buffer overflow.
      # Fix: FD_SET now checks fd_count < FD_SETSIZE. Fds beyond 64 are silently ignored (no crash).
      - name: TCP/FD Boundary test (Linux/macOS)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        run: |
          host/c/tllvm tools/TLLC/tllc.tllbc compile tests/fd_boundary_real_test.tll -o tests/fd_boundary_real_test.tllbc
          host/c/tllvm tests/fd_boundary_real_test.tllbc 2>&1 | tee /tmp/fd_boundary.log
          EXIT_CODE=${PIPESTATUS[0]}
          test "$EXIT_CODE" -eq 0
          grep -q "Test 1 PASS" /tmp/fd_boundary.log
          grep -q "Test 2 PASS" /tmp/fd_boundary.log
          grep -q "Test 3 PASS" /tmp/fd_boundary.log
          grep -q "Test 4 PASS" /tmp/fd_boundary.log
          grep -q "Test 5 PASS" /tmp/fd_boundary.log
          grep -q "ALL TESTS PASSED" /tmp/fd_boundary.log
          echo "=== TCP/FD Boundary Test (REAL fds) PASSED ==="

      # Windows: MSVC build test (system winsock2.h, not affected by TCC FD_SET bug)
      - name: TCP/FD Boundary test (Windows MSVC)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: powershell
        run: |
          host\c\tllvm.exe tools\TLLC\tllc.tllbc compile tests\fd_boundary_real_test.tll -o tests\fd_boundary_real_test.tllbc
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
          & host\c\tllvm.exe tests\fd_boundary_real_test.tllbc 2>&1 | Tee-Object -FilePath fd_boundary.log
          $EXIT_CODE = $LASTEXITCODE
          if ($EXIT_CODE -ne 0) { throw "Process exited with code $EXIT_CODE" }
          $log = Get-Content fd_boundary.log -Raw
          if ($log -notmatch "Test 1 PASS") { throw "Test 1 did not PASS" }
          if ($log -notmatch "Test 2 PASS") { throw "Test 2 did not PASS" }
          if ($log -notmatch "Test 3 PASS") { throw "Test 3 did not PASS (65 real fds beyond FD_SETSIZE)" }
          if ($log -notmatch "Test 4 PASS") { throw "Test 4 did not PASS" }
          if ($log -notmatch "Test 5 PASS") { throw "Test 5 did not PASS" }
          if ($log -notmatch "ALL TESTS PASSED") { throw "Test did not complete" }
          Write-Output "=== TCP/FD Boundary Test (Windows MSVC, REAL fds) PASSED ==="

      # Windows TCC build: THIS is the critical test for the FD_SET fix.
      # CI normally builds with MSVC (cl), which uses system winsock2.h (safe).
      # But the official build.bat uses TCC, which has its own fd_set with FD_SETSIZE=64.
      # The TCC FD_SET macro had NO bounds check -> >64 fds = stack buffer overflow.
      # This step builds tllvm_tcc.exe with the repo's bundled TCC and runs the real-fd test.
      - name: TCP/FD Boundary test (Windows TCC - critical)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: cmd
        run: |
          cd host\c
          REM Clear MSVC env vars to avoid TCC header conflicts
          set INCLUDE=
          set LIB=
          set LIBPATH=
          if not exist tcc\tcc\tcc.exe (
            echo Extracting TCC...
            powershell -Command "Expand-Archive -Path 'tcc.zip' -DestinationPath 'tcc' -Force"
          )
          echo Building tllvm_tcc.exe with TCC...
          tcc\tcc\tcc.exe -O2 -std=c99 -D_WIN32 "-Wl,-stack=0x4000000" -o tllvm_tcc.exe main.c vm.c value.c json.c builtin.c "%SystemRoot%\System32\ws2_32.dll" "%SystemRoot%\System32\winhttp.dll"
          if errorlevel 1 exit /b 1
          echo TCC build successful
          cd ..\..
          echo Compiling test with TCC-built tllvm...
          host\c\tllvm_tcc.exe tools\TLLC\tllc.tllbc compile tests\fd_boundary_real_test.tll -o tests\fd_boundary_real_tcc.tllbc
          if errorlevel 1 exit /b 1
          echo Running REAL fd boundary test with TCC-built runtime...
          host\c\tllvm_tcc.exe tests\fd_boundary_real_tcc.tllbc
          if errorlevel 1 exit /b 1
          echo === TCP/FD Boundary Test (Windows TCC, REAL fds) PASSED ===
