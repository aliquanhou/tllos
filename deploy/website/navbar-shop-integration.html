        <li><a href="https://github.com/aliquanhou/tllos" target="_blank">GitHub</a></li>
    </ul>
</nav>

<!-- ============================================================
     配套 CSS 样式（添加到官网的样式表中）
     ============================================================ -->
<style>
/* Shop 链接样式 */
.nav-shop-link {
    color: #fff;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: all 0.3s ease;
}

.nav-shop-link:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

/* Shop 按钮样式（带图标） */
.nav-shop-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
}

.nav-shop-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
}

/* 下拉菜单样式 */
.dropdown {
    position: relative;
}

.dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 200px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    padding: 8px 0;
    z-index: 1000;
}

.dropdown:hover .dropdown-menu {
    display: block;
}

.dropdown-menu li {
    list-style: none;
}

.dropdown-menu a {
    display: block;
    padding: 8px 16px;
    color: #333;
    text-decoration: none;
    transition: background 0.2s;
}

.dropdown-menu a:hover {
    background: #f5f5f5;
    color: #667eea;
}

.dropdown-divider {
    height: 1px;
    background: #eee;
    margin: 8px 0;
}
</style>


<!--
============================================================
部署验证清单
============================================================

1. [ ] 官网导航栏已添加 "Shop" 链接，指向 /shop
2. [ ] Nginx 已配置 /shop 反向代理到 127.0.0.1:8090
3. [ ] TLL 商城服务器已启动（监听 8090 端口）
4. [ ] 访问 https://tllos.com/shop 能正常打开商城首页
5. [ ] 商城所有功能（商品/购物车/下单/后台）正常可用
6. [ ] 官网其他页面不受影响
7. [ ] 移动端自适应正常

============================================================
快速测试命令
============================================================

# 测试商城服务器是否运行
curl http://127.0.0.1:8090/

# 测试 Nginx 反向代理
curl http://tllos.com/shop/

# 测试商城 API
curl -X POST http://tllos.com/shop/login \
  -H "Content-Type: application/json" \
  -d '{"username":"admin","password":"admin123"}'
-->
